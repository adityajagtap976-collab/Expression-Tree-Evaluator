[project]
name = "expression-tree-evaluator"
version = "0.1.0"
description = "CLI tool that converts infix expressions to postfix via a stack, builds a binary expression tree, and evaluates it via recursive traversal."
readme = "README.md"
authors = [
    { name = "adityajagtap976-collab", email = "adityajagtap976@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
expression-tree-evaluator = "expression_tree_evaluator:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
